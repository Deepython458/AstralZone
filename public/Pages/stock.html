<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock - ASTRALZONE</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <link rel="stylesheet" href="../Style/variables.css">
    <link rel="stylesheet" href="../Style/componentes.css">
    <link rel="stylesheet" href="../Style/sidebar.css">
    <link rel="stylesheet" href="../Style/seccion.css">
    <link rel="stylesheet" href="../Style/stock.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <section>
        <div class="gadgets">
            <h2>Administrador Stock</h2>
        </div>

        <div class="buscador">
            <span class="material-symbols-rounded">search</span>
            <input type="text" placeholder="Buscar sabor o marca...">
        </div>

        <div class="stock-layout">

            <div class="lista-stock">
                <div class="lista-stock--header">
                    <p>Stock</p>
                    <div class="header-acciones">
                        <button class="icono-cuadrado btn-copiar" type="button">
                            <span class="material-symbols-rounded">content_copy</span>
                        </button>
                        <label class="toggle-ojo">
                            <input type="checkbox" class="toggle-input" id="toggle-cantidad">
                            <span class="toggle-track">
                                <span class="material-symbols-rounded">visibility</span>
                                <span class="material-symbols-rounded">visibility_off</span>
                            </span>
                            <span class="toggle-knob"></span>
                        </label>
                    </div>
                </div>

                <div id="lista-stock-contenido"></div>
            </div>

            <div class="panel-stock-bajo">
                <p class="panel-stock-bajo--titulo">
                    Stock bajo <span class="badge" id="badge-stock-bajo">0</span>
                </p>
                <ul id="lista-stock-bajo"></ul>
            </div>
        </div>
    </section>

    <script src="../Scripts/layout.js"></script>
    <script src="../Scripts/stock.js"></script>
</body>
</html>
