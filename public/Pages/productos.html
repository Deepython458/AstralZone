<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ASTRALZONE</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <link rel="stylesheet" href="../Style/variables.css">
    <link rel="stylesheet" href="../Style/componentes.css">
    <link rel="stylesheet" href="../Style/sidebar.css">
    <link rel="stylesheet" href="../Style/seccion.css">
    <link rel="stylesheet" href="../Style/productos.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <section>
        <div class="gadgets">
            <h2>Productos</h2>
        </div>

        <div class="productos-grid" id="productos-grid">
            <button class="marca-card marca-card--nueva" type="button" id="btn-nueva-marca">
                <span class="material-symbols-rounded">add</span>
                <p>Nueva marca</p>
            </button>
        </div>

        <div class="modal-overlay" id="modal-marca">
            <div class="modal-panel">
                <div class="modal-panel--header">
                    <p>Nueva marca</p>
                    <span class="material-symbols-rounded modal-cerrar">close</span>
                </div>

                <form id="form-marca" class="modal-form">
                    <label>Nombre</label>
                    <input type="text" id="input-marca-nombre" required>

                    <label>Categoría</label>
                    <select id="input-marca-categoria" required></select>

                    <button type="submit" class="btn-agregar-sabor">Guardar</button>
                </form>

                <button type="button" id="btn-nueva-categoria" class="btn-agregar-sabor" style="margin-top: 10px; background: transparent; border-style: dashed;">
                    + Nueva categoría
                </button>
            </div>
        </div>

        <div class="modal-overlay" id="modal-categoria">
            <div class="modal-panel">
                <div class="modal-panel--header">
                    <p>Nueva categoría</p>
                    <span class="material-symbols-rounded modal-cerrar">close</span>
                </div>

                <form id="form-categoria" class="modal-form">
                    <label>Nombre</label>
                    <input type="text" id="input-categoria-nombre" required>

                    <button type="submit" class="btn-agregar-sabor">Guardar</button>
                </form>
            </div>
        </div>

        <div class="modal-overlay" id="modal-sabor">
            <div class="modal-panel">
                <div class="modal-panel--header">
                    <p>Nuevo sabor</p>
                    <span class="material-symbols-rounded modal-cerrar">close</span>
                </div>

                <form id="form-sabor" class="modal-form">
                    <label>Nombre</label>
                    <input type="text" id="input-sabor-nombre" required>

                    <label>Cantidad</label>
                    <input type="number" id="input-sabor-cantidad" min="0" required>

                    <label>Emoji 1</label>
                    <input type="text" id="input-sabor-emoji1" maxlength="2">

                    <label>Emoji 2</label>
                    <input type="text" id="input-sabor-emoji2" maxlength="2">

                    <button type="submit" class="btn-agregar-sabor">Guardar</button>
                </form>
            </div>
        </div>
    </section>

    <script src="../Scripts/layout.js"></script>
    <script src="../Scripts/productos.js"></script>
</body>
</html>
