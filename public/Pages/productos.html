<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - ASTRALZONE</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <link rel="stylesheet" href="../Style/variables.css">
    <link rel="stylesheet" href="../Style/componentes.css">
    <link rel="stylesheet" href="../Style/sidebar.css">
    <link rel="stylesheet" href="../Style/seccion.css">
    <link rel="stylesheet" href="../Style/productos.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <section>
        <div class="gadgets">
            <h2>Productos</h2>
        </div>

        <div class="productos-grid">

    <div class="marca-card">
        <div class="marca-card--header">
            <p class="marca-card--nombre">IGNITE V400 MIX</p>
            <span class="material-symbols-rounded marca-card--chevron">expand_more</span>
        </div>
    </div>

    <div class="marca-card">
        <div class="marca-card--header">
            <p class="marca-card--nombre">ELFBARICEKING 40K</p>
            <span class="material-symbols-rounded marca-card--chevron">expand_more</span>
        </div>

        <div class="marca-card--sabores">
            <ul>
                <li>
                    <div class="sabor-item">
                        <p>🍉❄️ WatermelonIce</p>
                        <div class="cantidad-selector">
                            <button class="btn-cantidad">-</button>
                            <span class="cantidad-valor">12</span>
                            <button class="btn-cantidad">+</button>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="sabor-item">
                        <p>🫐❄️ BlueRazzIce</p>
                        <div class="cantidad-selector">
                            <button class="btn-cantidad">-</button>
                            <span class="cantidad-valor">5</span>
                            <button class="btn-cantidad">+</button>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="sabor-item">
                        <p>🍑❄️ PeachIce</p>
                        <div class="cantidad-selector">
                            <button class="btn-cantidad">-</button>
                            <span class="cantidad-valor">8</span>
                            <button class="btn-cantidad">+</button>
                        </div>
                    </div>
                </li>
                <li>
                    <div class="sabor-item">
                        <p>🍇❄️ GrapeIce</p>
                        <div class="cantidad-selector">
                            <button class="btn-cantidad">-</button>
                            <span class="cantidad-valor">3</span>
                            <button class="btn-cantidad">+</button>
                        </div>
                    </div>
                </li>
            </ul>

            <button class="btn-agregar-sabor" type="button">
                <span class="material-symbols-rounded">add</span> Agregar sabor
            </button>
        </div>
    </div>

    <div class="marca-card">
        <div class="marca-card--header">
            <p class="marca-card--nombre">ELFBARBCREATED 40K</p>
            <span class="material-symbols-rounded marca-card--chevron">expand_more</span>
        </div>
    </div>

    <div class="marca-card marca-card--nueva">
        <span class="material-symbols-rounded">add</span>
        <p>Nueva marca</p>
    </div>

</div>
    </section>

    <script src="../Scripts/layout.js"></script>
    <script src="../Scripts/productos.js"></script>
</body>
</html>
