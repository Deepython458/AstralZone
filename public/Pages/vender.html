<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vender - ASTRALZONE</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded" />
    <link rel="stylesheet" href="../Style/variables.css">
    <link rel="stylesheet" href="../Style/componentes.css">
    <link rel="stylesheet" href="../Style/sidebar.css">
    <link rel="stylesheet" href="../Style/seccion.css">
    <link rel="stylesheet" href="../Style/venta.css">
</head>
<body>
    <div id="sidebar-container"></div>

    <section>
        <div class="gadgets">
            <h2>Vender</h2>
        </div>

        <div class="venta-layout">

            <div class="lista-productos">
                <p class="lista-productos--titulo">Disponibles</p>
                <div id="lista-productos-contenido"></div>
            </div>

            <div class="carrito">
                <p class="carrito--titulo">Carrito</p>
                <ul class="carrito-lista" id="carrito-lista"></ul>

                <div class="carrito-resumen">
                    <div class="carrito-total">
                        <p>Total</p>
                        <input type="text" class="total-input" id="total-input" placeholder="$0" inputmode="numeric">
                    </div>

                    <div class="sugerencias-precio">
                        <button class="btn-sugerencia" type="button">$25.500</button>
                        <button class="btn-sugerencia" type="button">$29.400</button>
                        <button class="btn-sugerencia" type="button">$24.500</button>
                    </div>

                    <div class="carrito-botones">
                        <button class="btn-accion vender" id="btn-vender" type="button">Vender</button>
                        <button class="btn-accion pendiente" id="btn-pendiente" type="button">Pendiente</button>
                        <button class="btn-accion reiniciar" id="btn-reiniciar" type="button">Reiniciar</button>
                    </div>
                </div>

                <div class="pendientes">
                    <p class="pendientes--titulo">Pedidos pendientes</p>
                    <ul class="pendientes-lista" id="pendientes-lista"></ul>
                </div>
            </div>
        </div>
    </section>
    <script src="../Scripts/vender.js"></script>
    <script src="../Scripts/layout.js"></script>
</body>
</html>
